name: Build Unsigned iOS IPA

# 鍦ㄤ簯绔?macOS锛圙itHub Actions 鎻愪緵鐨?Mac锛変笂鏋勫缓涓€涓€愭湭绛惧悕銆戠殑 Readest.ipa銆?# 鏃犻渶浠讳綍 Apple 璇佷功锛涗骇鐗╀笅杞藉悗鐢ㄢ€滆交鏉剧 / 鏄撶鈥濈瓑宸ュ叿鑷绛惧悕瀹夎銆?
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ios-unsigned.yml

jobs:
  build-unsigned-ipa:
    name: Build unsigned Readest.ipa
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # 浠撳簱鍖呭惈 8 涓?git 瀛愭ā鍧楋紙foliate-js銆乼auri銆乸lugins 绛夛級锛屾瀯寤哄繀闇€
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode and print toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          echo "--- Xcode ---"
          xcodebuild -version
          echo "--- available targets ---"
          xcodebuild -project apps/readest-app/src-tauri/gen/apple/Readest.xcodeproj -list || true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (iOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (Next.js static export -> out/)
        working-directory: apps/readest-app
        run: pnpm build

      - name: Build unsigned .app
        working-directory: apps/readest-app/src-tauri/gen/apple
        run: |
          set -euo pipefail
          xcodebuild \
            -project Readest.xcodeproj \
            -target Readest_iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA (Payload layout)
        working-directory: apps/readest-app/src-tauri/gen/apple
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name 'Readest.app' -type d | head -1)"
          test -n "$APP_PATH"
          echo "Built app: $APP_PATH"
          rm -rf Payload Readest-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qr Readest-unsigned.ipa Payload
          ls -lh Readest-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Readest-unsigned-ipa
          path: apps/readest-app/src-tauri/gen/apple/Readest-unsigned.ipa
          retention-days: 30
