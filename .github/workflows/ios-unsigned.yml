name: Build Unsigned iOS IPA

# 在云端 macOS（GitHub Actions 提供的 Mac）上构建一个【未签名】的 Readest.ipa。
# 无需任何 Apple 证书；产物下载后用“轻松签 / 易签”等工具自行签名安装。

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ios-unsigned.yml

jobs:
  build-unsigned-ipa:
    name: Build unsigned Readest.ipa
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # 仓库包含 8 个 git 子模块（foliate-js、tauri、plugins 等），构建必需
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode and print toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          echo "--- Xcode ---"
          xcodebuild -version
          echo "--- available targets ---"
          xcodebuild -project apps/readest-app/src-tauri/gen/apple/Readest.xcodeproj -list || true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (iOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 用官方 Tauri CLI 驱动整个流程：它会自动构建前端(Next.js)、启动本地 build server、
      # archive（跳过 codesign），并把未签名的 .app 直接打包成 Payload 结构的 ipa。
      - name: Build unsigned iOS IPA (tauri ios build --no-sign)
        working-directory: apps/readest-app
        run: pnpm tauri ios build --no-sign

      - name: Show build output
        run: ls -lh apps/readest-app/src-tauri/gen/apple/build/arm64/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Readest-unsigned-ipa
          path: apps/readest-app/src-tauri/gen/apple/build/arm64/Readest.ipa
          retention-days: 30
